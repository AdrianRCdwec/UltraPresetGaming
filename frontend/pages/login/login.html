<!-- ========================= -->
<!--        LOGIN PAGE         -->
<!-- ========================= -->
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión - UltraPresetGaming</title>

        <!-- Icono -->
        <link rel="icon" type="image/x-icon" href="../../assets/favicon.ico">

        <!-- CSS -->
        <link rel="stylesheet" href="login.css" type="text/css"> 
        <link rel="stylesheet" href="../../shared/css/reset.css" type="text/css">

        <!-- Fuentes -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    </head>

    <body>
        <!-- ========================= -->
        <!--     CONTENEDOR GENERAL    -->
        <!-- ========================= -->
        <div class="container">

            <!-- ========================= -->
            <!--       HEADER LOGIN        -->
            <!-- ========================= -->
            <div class="header-login">
                <!-- Logo -->
                <img src="../../assets/images/misc/logo.png" alt="UltraPresetGaming" class="logo-login">

                <!-- Título + subtítulo -->
                <h1>UltraPresetGaming</h1>
                <p>Accede a los mejores precios y mods</p>
            </div>

            <!-- ========================= -->
            <!--        FORMULARIO         -->
            <!-- ========================= -->
            <form class="login-form"> <!-- /login -->

                <!-- Campo: Usuario o Correo -->
                <div class="input-group">
                    <label for="username">Usuario o Correo electrónico</label>
                    <input type="text" id="username" name="username" required>
                    <span class="input-icon icon-base">👤</span>
                </div>

                <!-- Campo: Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                    <span class="input-icon icon-base">🔒</span>
                    <button type="button" id="togglePassword" class="toggle-password icon-base" aria-label="Mostrar contraseña">👁️</button>
                </div>

                <!-- Opciones extra (Recuérdame y Olvidé contraseña) -->
                <div class="options-group">
                    <label class="remember-me" for="rememberMe">
                        <input type="checkbox" id="rememberMe">
                        <span>Recuérdame</span>
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <!-- ========================= -->
            <!--     FOOTER DEL LOGIN      -->
            <!-- ========================= -->
            <div class="footer-login">
                <!-- Link a registro -->
                <a href="../register/register.html">¿No tienes cuenta? Regístrate</a>

                <!-- Volver a inicio -->
                <a href="../home/index.html" class="back-home">⬅️ Volver al inicio</a>
            </div>

        </div>
        <script src="login.js"></script>
        <script src="../../shared/js/auth-header.js"></script>
    </body>
</html>
